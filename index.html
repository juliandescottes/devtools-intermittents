<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>DevTools intermittents</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<style>
  :root { color-scheme: light dark; font-family: system-ui, sans-serif; }
  body { max-width: 1100px; margin: 0 auto; padding: 1em; }
  .charts { display: grid; grid-template-columns: 1fr 1fr; gap: 1em; }
  table { border-collapse: collapse; width: 100%; margin-top: 1em; }
  table { table-layout: fixed; }
  td { overflow-wrap: anywhere; }
  th:nth-child(1) { width: 5em; }
  th:nth-child(3) { width: 13em; }
  th:nth-child(4) { width: 28%; }
  td, th { text-align: left; vertical-align: top; padding: 6px; border-bottom: 1px solid #8884; }
  td.count { text-align: right; font-variant-numeric: tabular-nums; }
  .done .bug { text-decoration: line-through; opacity: 0.6; }
  .tag { font-size: 0.8em; padding: 1px 6px; border-radius: 8px; background: #8883; white-space: nowrap; }
  .tag.new { background: #e66a; }
  .tag.hint { background: #f90a; }
  .tags { display: flex; flex-direction: column; align-items: flex-start; gap: 4px; }
  .details { font-size: 0.85em; opacity: 0.8; margin-top: 2px; }
  .details code { white-space: pre-wrap; }
  ul { margin: 0; padding-left: 1.2em; }
  details { font-size: 0.9em; opacity: 0.8; }
  section { margin-top: 2.5em; }
  .pager { display: flex; gap: 1em; align-items: center; margin-top: 1.5em; }
</style>
</head>
<body>
<h1>DevTools intermittents</h1>
<p>Bugs in the DevTools product with 10 or more failures in a week.
  <a href="https://mzl.la/3yj4Azn">Intermittents with NEEDINFO</a>,
  <a href="https://mzl.la/3BrCd5o">not disabled</a>.
  <a href="https://github.com/juliandescottes/devtools-intermittents/edit/main/notes.md">Edit notes</a>.</p>
<div class="charts">
  <div><canvas id="bugCount"></canvas></div>
  <div><canvas id="total"></canvas></div>
</div>
<nav class="pager"></nav>
<div id="weeks"></div>
<nav class="pager"></nav>
<script>
const MOVING_AVERAGE_WEEKS = 5;
const WEEKS_PER_PAGE = 10;

function parseNotes(text) {
  const weeks = {};
  let week = null;
  let bug = null;
  for (const line of text.split("\n")) {
    let m;
    if ((m = line.match(/^## (\d{4}-\d{2}-\d{2})/))) {
      week = weeks[m[1]] = { notes: [], bugs: {} };
      bug = null;
    } else if (!week) {
      continue;
    } else if ((m = line.match(/^- \[([ xX])\] (\d+)\s*(.*)$/))) {
      bug = week.bugs[m[2]] = { done: m[1] !== " ", notes: m[3] ? [m[3]] : [] };
    } else if ((m = line.match(/^\s+- (.*)$/)) && bug) {
      bug.notes.push(m[1]);
    } else if (line.trim() && !bug) {
      week.notes.push(line.trim());
    }
  }
  return weeks;
}

function el(tag, props = {}, children = []) {
  const node = Object.assign(document.createElement(tag), props);
  node.append(...children);
  return node;
}

function richText(text) {
  const parts = [];
  const re = /\[([^\]]+)\]\((https?:[^)\s]+)\)/g;
  let last = 0;
  for (const m of text.matchAll(re)) {
    parts.push(text.slice(last, m.index), el("a", { href: m[2], textContent: m[1] }));
    last = m.index + m[0].length;
  }
  parts.push(text.slice(last));
  return parts;
}

function addDays(isoDate, days) {
  const d = new Date(isoDate + "T00:00:00Z");
  d.setUTCDate(d.getUTCDate() + days);
  return d.toISOString().slice(0, 10);
}

function movingAverage(values) {
  return values.map((_, i) => {
    const window = values.slice(Math.max(0, i - MOVING_AVERAGE_WEEKS + 1), i + 1)
      .filter(v => v != null);
    return window.length ? window.reduce((a, b) => a + b, 0) / window.length : null;
  });
}

function drawChart(id, title, history, key, color) {
  const values = history.map(e => e[key] ?? null);
  new Chart(document.getElementById(id), {
    type: "line",
    data: {
      labels: history.map(e => e.week),
      datasets: [
        { label: title, data: values, borderColor: color, pointRadius: 0, borderWidth: 2 },
        { label: `${MOVING_AVERAGE_WEEKS}-week average`, data: movingAverage(values),
          borderColor: color + "66", pointRadius: 0, borderWidth: 2 },
      ],
    },
    options: {
      plugins: { title: { display: true, text: title } },
      interaction: { mode: "index", intersect: false },
      scales: { x: { ticks: { maxTicksLimit: 8 } }, y: { beginAtZero: true } },
    },
  });
}

const INTEGRATION_TREES = ["autoland", "mozilla-central", "try"];

function daysBetween(from, to) {
  return Math.round((new Date(to) - new Date(from)) / 86400000);
}

function sumCounts(pairs) {
  return pairs.reduce((sum, [, count]) => sum + count, 0);
}

function hints(bug, previous, end) {
  if (!bug.trees) {
    return [];
  }
  const total = sumCounts(bug.trees);
  const result = [];
  const [topConfig, topCount] = bug.configs[0] || [];
  if (topCount / total >= 0.8) {
    result.push(`mostly ${topConfig}`);
  }
  const otherTrees = bug.trees.filter(([tree]) => !INTEGRATION_TREES.includes(tree));
  if (sumCounts(otherTrees) / total >= 0.8) {
    result.push(`mostly ${otherTrees.map(([tree]) => tree.replace("mozilla-", "")).join("/")}`);
  }
  if (bug.resolution) {
    result.push(`${bug.resolution.toLowerCase()} but still failing`);
  }
  for (const { who, since } of bug.needinfos) {
    const days = daysBetween(since, end);
    if (days >= 14) {
      result.push(`needinfo ${who} for ${days} days`);
    }
  }
  if (bug.lastFailure && daysBetween(bug.lastFailure, end) >= 3) {
    result.push(`no failure since ${bug.lastFailure}`);
  }
  if (bug.messages.length && bug.messages[0][1] / total < 0.5) {
    result.push("mixed failures");
  }
  if (previous?.count && bug.count >= 2 * previous.count) {
    result.push(`spiking (was ${previous.count})`);
  }
  if (bug.patches.length && !bug.resolution) {
    result.push("has patch");
  }
  return result;
}

function bugDetails(bug) {
  if (!bug.trees) {
    return [];
  }
  const total = sumCounts(bug.trees);
  const pairs = list => list.map(([name, count]) => `${name} ${count}`).join(", ");
  const people = [
    bug.assignee ? `Assigned to ${bug.assignee}.` : "",
    ...bug.needinfos.map(({ who, since }) => `Needinfo ${who} since ${since}.`),
  ].filter(Boolean).join(" ");
  return [
    el("div", { className: "details" }, [
      `${pairs(bug.configs)} · ${pairs(bug.trees)} · last failure ${bug.lastFailure} · `,
      el("a", { href: bug.exampleLog, textContent: "latest log" }),
    ]),
    ...bug.messages.map(([message, count]) =>
      el("div", { className: "details" }, [el("code", { textContent: message }), ` (${count}/${total})`])),
    people || bug.patches.length ? el("div", { className: "details" }, [
      people,
      ...bug.patches.flatMap(d => [" ", el("a", {
        href: `https://phabricator.services.mozilla.com/${d}`, textContent: d })]),
    ]) : "",
  ];
}

function renderWeek(history, notes, index) {
  const entry = history[index];
  const weekNotes = notes[entry.week] || { notes: [], bugs: {} };
  const start = entry.start || addDays(entry.week, -7);
  const end = entry.end || addDays(entry.week, -1);
  const treeherder = "https://treeherder.mozilla.org/intermittent-failures/main?" +
    new URLSearchParams({ startday: start, endday: end, tree: "all", product: "DevTools" });
  const buglist = "https://bugzilla.mozilla.org/buglist.cgi?bug_id=" +
    entry.bugs.map(b => b.id).join("%2C");


  const rows = entry.bugs.map(bug => {
    let streak = 1;
    while (index - streak >= 0 && history[index - streak].bugs.some(b => b.id === bug.id)) {
      streak++;
    }
    const seenBefore = history.slice(0, index).some(e => e.bugs.some(b => b.id === bug.id));
    const tag = !seenBefore ? el("span", { className: "tag new", textContent: "new" })
      : streak > 1 ? el("span", { className: "tag", textContent: `${streak} weeks in a row` })
      : el("span", { className: "tag", textContent: "back" });

    const own = weekNotes.bugs[bug.id] || { done: false, notes: [] };
    const earlier = history.slice(0, index).reverse()
      .filter(e => notes[e.week]?.bugs[bug.id]?.notes.length)
      .map(e => el("li", {}, [`${e.week}: `, ...richText(notes[e.week].bugs[bug.id].notes.join(" / "))]));

    const previous = index > 0 ? history[index - 1].bugs.find(b => b.id === bug.id) : null;
    const hintTags = hints(bug, previous, end)
      .map(h => el("span", { className: "tag hint", textContent: h }));

    return el("tr", { className: own.done ? "done" : "" }, [
      el("td", { className: "count", textContent: bug.count ?? "?" }),
      el("td", {}, [
        el("div", { className: "bug" }, [
          el("a", { href: `https://bugzilla.mozilla.org/show_bug.cgi?id=${bug.id}`,
                    textContent: `Bug ${bug.id}` }),
          ` - ${bug.summary}`,
        ]),
        ...bugDetails(bug),
      ]),
      el("td", {}, [el("div", { className: "tags" }, [tag, ...hintTags])]),
      el("td", {}, [
        el("ul", {}, own.notes.map(n => el("li", {}, richText(n)))),
        earlier.length ? el("details", {}, [el("summary", { textContent: "Earlier notes" }),
                                            el("ul", {}, earlier)]) : "",
      ]),
    ]);
  });
  return el("section", { id: entry.week }, [
    el("h2", { textContent: `Week of ${entry.week}` }),
    el("p", {}, [
      entry.bugCount != null ? `Bugs: ${entry.bugCount}. Total failures: ${entry.total}. ` : "",
      `${start} to ${end}. `,
      el("a", { href: treeherder, textContent: "Treeherder" }), ", ",
      el("a", { href: buglist, textContent: "Bugzilla list" }),
    ]),
    ...weekNotes.notes.map(n => el("p", {}, richText(n))),
    el("table", {}, [
      el("thead", {}, [el("tr", {}, ["Failures", "Bug", "", "Notes"].map(t => el("th", { textContent: t })))]),
      el("tbody", {}, rows),
    ]),
  ]);
}

function renderPage(weeks, notes) {
  const pageCount = Math.ceil(weeks.length / WEEKS_PER_PAGE);
  const page = Math.min(Math.max(Number(location.hash.match(/page=(\d+)/)?.[1]) || 1, 1), pageCount);
  const last = weeks.length - 1 - (page - 1) * WEEKS_PER_PAGE;
  const first = Math.max(0, last - WEEKS_PER_PAGE + 1);
  const sections = [];
  for (let i = last; i >= first; i--) {
    sections.push(renderWeek(weeks, notes, i));
  }
  document.getElementById("weeks").replaceChildren(...sections);

  for (const pager of document.querySelectorAll(".pager")) {
    pager.replaceChildren(
      page > 1 ? el("a", { href: "#page=1", textContent: "Newest" }) : el("span", { textContent: "Newest" }),
      page > 1 ? el("a", { href: `#page=${page - 1}`, textContent: "Newer" }) : el("span", { textContent: "Newer" }),
      `Page ${page} of ${pageCount} (${weeks[first].week} to ${weeks[last].week})`,
      page < pageCount ? el("a", { href: `#page=${page + 1}`, textContent: "Older" }) : el("span", { textContent: "Older" }),
    );
  }
}

(async function () {
  const [history, notesText] = await Promise.all([
    fetch("data/history.json").then(r => r.json()),
    fetch("notes.md").then(r => r.text()),
  ]);
  const notes = parseNotes(notesText);

  drawChart("bugCount", "Bugs with 10+ failures", history, "bugCount", "#3b78e7");
  drawChart("total", "Total failures for these bugs", history, "total", "#e53935");

  const weeks = history.filter(e => e.bugs);
  renderPage(weeks, notes);
  window.addEventListener("hashchange", () => {
    renderPage(weeks, notes);
    document.querySelector(".pager").scrollIntoView();
  });
})();
</script>
</body>
</html>
